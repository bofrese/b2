<!doctype html>
<!--
  b2 mockup gallery template - shared by any b2 skill that generates a set of mockup concepts for
  side-by-side review (design-expert's website mockups, present-design-expert's presentation-theme
  mockups). Each consumer regenerates its own index.html from this template into its own folder.
  The gallery shell itself uses no fetch() and no external CSS/JS. The mockups it embeds may load
  CDN libraries and linked assets, so serve website/ (e.g. /b2:serve) and open the gallery's
  index.html over http; file:// still works for CDN-only mockups.
  Replace {{GALLERY_TITLE}}, {{COUNT}}, and the <!-- CARDS --> marker with one .card block per
  mockup, in CREATION ORDER.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{GALLERY_TITLE}} - Mockup Gallery</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#111; --muted:#666; --line:#e5e5e5; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f0f0f; --fg:#f2f2f2; --muted:#9a9a9a; --line:#262626; --card:#161616; } }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:32px 40px 8px; }
  header h1 { margin:0 0 4px; font-size:22px; font-weight:650; }
  header p { margin:0; color:var(--muted); font-size:14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:24px; padding:24px 40px 48px; }
  .card { border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--card); display:flex; flex-direction:column; }
  .thumb { position:relative; height:220px; overflow:hidden; border-bottom:1px solid var(--line); background:#fff; }
  /* Live scaled iframe: render at 1280px wide, scale to fit, ignore pointer events. */
  .thumb iframe { width:1280px; height:900px; border:0; transform:scale(.2656); transform-origin:top left; pointer-events:none; }
  .thumb a.open { position:absolute; inset:0; z-index:2; }
  .body { padding:14px 16px 16px; display:flex; flex-direction:column; gap:6px; }
  .body h2 { margin:0; font-size:16px; font-weight:600; }
  .direction { color:var(--muted); font-size:13px; }
  .notes { font-size:13px; color:var(--fg); margin-top:4px; }
  .actions { margin-top:8px; }
  .actions a { font-size:13px; text-decoration:none; color:inherit; border:1px solid var(--line); border-radius:6px; padding:5px 10px; }
  .actions a:hover { border-color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>{{GALLERY_TITLE}} - Mockup Gallery</h1>
  <p>{{COUNT}} concepts · in creation order · open any to view full-screen</p>
</header>
<main class="grid">
  <!-- CARDS -->
  <!--
  Repeat this block once per mockup, in creation order:

  <article class="card">
    <div class="thumb">
      <iframe src="concept-1.html" loading="lazy" title="Concept 1 preview" scrolling="no"></iframe>
      <a class="open" href="concept-1.html" target="_blank" rel="noopener" aria-label="Open concept 1"></a>
    </div>
    <div class="body">
      <h2>{{DIRECTION NAME}}</h2>
      <div class="direction">Concept 1</div>
      <p class="notes">{{DESIGN NOTES - from the concept's Design notes comment block}}</p>
      <div class="actions"><a href="concept-1.html" target="_blank" rel="noopener">Open full &rarr;</a></div>
    </div>
  </article>
  -->
</main>
</body>
</html>
